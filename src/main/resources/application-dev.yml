spring:
  datasource:
    url: jdbc:mysql://localhost:3306/bricopro?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    hikari:
      maximum-pool-size: 5
  redis:
    host: localhost
    port: 6379

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    out-of-order: true

  mail:
    username: ${MAIL_USERNAME:dev@bricopro.ma}
    password: ${MAIL_PASSWORD:dev-password}

app:
  jwt:
    secret: ${JWT_SECRET:ZGV2LXNlY3JldC1rZXktZm9yLWJyaWNvcHJvLWRldmVsb3BtZW50LW9ubHktbm90LWZvci1wcm9kdWN0aW9u}
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 2592000000

  upload:
    # In dev: store files in your project's run directory under uploads/
    # Change this to any local path you prefer, e.g. /tmp/bricopro-dev
    base-dir: ${UPLOAD_BASE_DIR:./uploads}
    base-url: ${APP_BASE_URL:http://localhost:8080}

server:
  port: 8080

springdoc:
  swagger-ui:
    enabled: true
    try-it-out-enabled: true

logging:
  level:
    com.BricoPro: DEBUG
    org.springframework.security: DEBUG
    org.flywaydb: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
